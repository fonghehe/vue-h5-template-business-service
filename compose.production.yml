# Standalone production definition. Supply reviewed environment values and a
# managed/dedicated PostgreSQL database; place a TLS proxy in front of localhost.
x-environment: &production-environment
  APP_ENV: production
  PORT: "8002"
  LOG_FORMAT: json
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the dedicated production database}
  JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET}
  MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:?Set a random mock webhook secret}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set the HTTPS frontend origin}
  AUTO_MIGRATE: "false"
  SEED: "false"
  REFRESH_COOKIE_SECURE: "true"
  REDIS_URL: ${REDIS_URL:-}
services:
  business:
    build: .
    image: vue-h5-template-business-service:local
    environment: *production-environment
    ports:
      - "127.0.0.1:8002:8002"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
  migrate:
    image: vue-h5-template-business-service:local
    environment: *production-environment
    command: ["/app/migrate", "up"]
    profiles: ["tools"]
    restart: "no"
